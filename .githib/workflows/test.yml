name: Run hello test

on:
  pull_request:
    branches: ["daphne_main"]

  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 16.18

      - name: Install Dependencies
        run: npm ci
      - name: Run hello test
        run: npm test
